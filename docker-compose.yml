# Môi trường dev. Chạy: python3 scripts/init_env.py && docker compose up --build
# Production dùng thêm docker-compose.prod.yml (Caddy, build tĩnh, không mở cổng DB/Redis).
name: fanpage

x-backend: &backend
  build:
    context: ./backend
    target: dev
  env_file: .env
  environment:
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    REDIS_URL: redis://redis:6379/0
    # API và worker chỉ dùng tài khoản ứng dụng (bị RLS). Không nhận mật khẩu quản trị DB.
    POSTGRES_PASSWORD: ""
  volumes:
    - ./backend:/app
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Thiếu POSTGRES_DB trong .env}
      POSTGRES_USER: ${POSTGRES_USER:?Thiếu POSTGRES_USER trong .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Thiếu POSTGRES_PASSWORD trong .env}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:?Thiếu POSTGRES_APP_USER trong .env}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Thiếu POSTGRES_APP_PASSWORD trong .env}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${DB_PUBLISH_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:${REDIS_PUBLISH_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Container quản trị: chạy migration một lần rồi thoát; backend và worker chỉ khởi động
  # khi migration thành công. Test và lệnh CLI quản trị cũng chạy trong container này.
  migrate:
    build:
      context: ./backend
      target: dev
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  backend:
    <<: *backend
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3).status == 200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 30

  worker:
    <<: *backend
    command: ["arq", "app.workers.settings.WorkerSettings"]

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0"]
    environment:
      BACKEND_URL: http://backend:8000
    volumes:
      - ./frontend:/app
      # node_modules riêng cho Linux, không dùng chung với máy macOS/Windows.
      - frontend_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173/"]
      interval: 5s
      timeout: 3s
      retries: 60
    restart: unless-stopped

  # Image sao lưu (decisions.md mục R), chỉ dùng cho `make check-backup`. Không chạy khi `docker compose up`.
  backup:
    profiles: ["tools"]
    build:
      context: ./deploy/backup
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER}
    depends_on:
      db:
        condition: service_healthy

  # ---------- Stack e2e riêng (decisions.md mục L): `make e2e`. Không chạy khi `docker compose up`.
  # DB fanpage_e2e_test, Redis db 13, backend :8001, frontend :5174. Không đụng DB dev.
  e2e-migrate:
    profiles: ["e2e"]
    build:
      context: ./backend
      target: dev
    env_file: .env
    environment: &e2e-env
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: fanpage_e2e_test
      POSTGRES_APP_USER: fanpage_app_e2e
      REDIS_URL: redis://redis:6379/13
      APP_BASE_URL: http://localhost:5174
    volumes:
      - ./backend:/app
    # Tạo lại từ đầu: lần chạy trước bị ngắt (Ctrl+C) chưa kịp dọn cũng không để lại dữ liệu.
    command: ["python", "-m", "app.mock.sandbox", "prepare", "--recreate"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  backend-e2e:
    <<: *backend
    profiles: ["e2e"]
    environment:
      <<: *e2e-env
      POSTGRES_PASSWORD: ""
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      e2e-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3).status == 200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 30

  worker-e2e:
    <<: *backend
    profiles: ["e2e"]
    command: ["arq", "app.workers.settings.WorkerSettings"]
    environment:
      <<: *e2e-env
      POSTGRES_PASSWORD: ""
    depends_on:
      e2e-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  frontend-e2e:
    profiles: ["e2e"]
    image: node:22-alpine
    working_dir: /app
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0"]
    environment:
      BACKEND_URL: http://backend-e2e:8000
    volumes:
      - ./frontend:/app
      - frontend_e2e_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:5174:5173"
    depends_on:
      backend-e2e:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173/"]
      interval: 5s
      timeout: 3s
      retries: 60
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  frontend_node_modules:
  frontend_e2e_node_modules:
