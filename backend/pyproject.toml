[project]
name = "fanpage-backend"
version = "0.1.0"
description = "Hệ thống đo lường nhân viên phụ trách Fanpage — backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "argon2-cffi>=23.1",
    "cryptography>=43",
    "redis>=5.2",
    "arq>=0.26",
    "pywebpush>=2.0",
    "httpx>=0.28",
    "openpyxl>=3.1",
    "defusedxml>=0.7",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers"
pythonpath = ["."]
markers = [
    "integration: cần PostgreSQL và Redis thật",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # cho phép ký tự tiếng Việt trong chuỗi/comment

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
# pywebpush không có type hints; chỉ dùng hàm webpush và WebPushException.
module = ["pywebpush", "pywebpush.*"]
ignore_missing_imports = true
