<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Tổng quan trên điện thoại</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F63B8;text-decoration:none}a:hover{color:#174C8E}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F6F8; font-family: 'Be Vietnam Pro', system-ui, sans-serif; color: #101828; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 18px 16px 12px; background: #FFFFFF; border-bottom: 1px solid #E4E7EC; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <div style="display: flex; flex-direction: column"><span style="font-size: 12px; color: #667085">186 nhân viên · 186 Trang</span><span style="font-size: 20px; font-weight: 700">Tổng quan</span></div>
      <span style="font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: #FEF0E8; color: #9A3B12">Dữ liệu mẫu</span>
    </div>
    <div role="group" aria-label="Khoảng thời gian" style="display: flex; gap: 6px">
      <sc-for list="{{ranges}}" as="r" hint-placeholder-count="3">
        <button type="button" onClick="{{r.pick}}" aria-pressed="{{r.on}}" style="{{r.style}}">{{r.label}}</button>
      </sc-for>
    </div>
  </header>

  <div style="flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{kpis}}" as="k" hint-placeholder-count="4">
        <div style="padding: 12px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E4E7EC; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 12px; color: #475467">{{k.label}}</span>
          <span style="font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums">{{k.value}}</span>
          <span style="{{k.deltaStyle}}">{{k.delta}}</span>
        </div>
      </sc-for>
    </div>

    <div style="padding: 14px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E4E7EC; display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 14px; font-weight: 600">Khách chốt theo ngày</span>
      <svg role="img" aria-label="Khách chốt tăng trong 30 ngày" viewBox="0 0 330 110" style="width: 100%; height: 110px">
        <line x1="0" y1="104" x2="330" y2="104" stroke="#D0D5DD" stroke-width="1"></line>
        <polyline points="{{area}}" fill="#2A78D6" fill-opacity="0.10" stroke="none"></polyline>
        <polyline points="{{line}}" fill="none" stroke="#2A78D6" stroke-width="2" stroke-linejoin="round"></polyline>
      </svg>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 14px; font-weight: 600">Cần xử lý</span>
      <a href="Leads.dc.html" style="display: flex; justify-content: space-between; align-items: center; min-height: 52px; padding: 0 14px; border-radius: 12px; background: #FFFFFF; border: 1px solid #F4C7C3; color: #101828; font-size: 14px"><span><b style="color: #9B2A22">47</b> khách quá 48 giờ chưa có kết quả</span><span aria-hidden="true" style="color: #667085">›</span></a>
      <a href="Staff.dc.html" style="display: flex; justify-content: space-between; align-items: center; min-height: 52px; padding: 0 14px; border-radius: 12px; background: #FFFFFF; border: 1px solid #F5DEB0; color: #101828; font-size: 14px"><span><b style="color: #8A5300">9</b> nhân viên trả lời chậm</span><span aria-hidden="true" style="color: #667085">›</span></a>
      <a href="BMs.dc.html" style="display: flex; justify-content: space-between; align-items: center; min-height: 52px; padding: 0 14px; border-radius: 12px; background: #FFFFFF; border: 1px solid #C9DDF5; color: #101828; font-size: 14px"><span><b style="color: #174C8E">27</b> Trang chưa có người phụ trách</span><span aria-hidden="true" style="color: #667085">›</span></a>
      <a href="Ads.dc.html" style="display: flex; justify-content: space-between; align-items: center; min-height: 52px; padding: 0 14px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E4E7EC; color: #101828; font-size: 14px"><span><b>1</b> chiến dịch chi phí/chốt quá cao</span><span aria-hidden="true" style="color: #667085">›</span></a>
    </div>
  </div>

  <nav aria-label="Điều hướng" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #FFFFFF; border-top: 1px solid #E4E7EC; padding: 6px 4px 18px">
    <a href="Main.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 48px; font-size: 11px; font-weight: 600; color: #1F63B8"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"></rect><rect x="14" y="3" width="7" height="5" rx="1"></rect><rect x="14" y="12" width="7" height="9" rx="1"></rect><rect x="3" y="16" width="7" height="5" rx="1"></rect></svg>Tổng quan</a>
    <a href="Staff.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 48px; font-size: 11px; color: #475467"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c2 .7 3.2 2.5 3.5 5.2"></path></svg>Nhân viên</a>
    <a href="Leads.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 48px; font-size: 11px; color: #475467"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 4h18l-7 8v6l-4 2v-8z"></path></svg>Khách</a>
    <a href="Ads.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 48px; font-size: 11px; color: #475467"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l15-6v14L3 13z"></path><path d="M7 13v5"></path></svg>Quảng cáo</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { range: 1 }; }
  renderVals() {
    const ranges = ['7 ngày', '30 ngày', '90 ngày'].map((label, i) => {
      const on = this.state.range === i;
      return { label, on: String(on), pick: () => this.setState({ range: i }),
        style: 'flex: 1; min-height: 40px; border-radius: 99px; font: inherit; font-size: 13px; cursor: pointer; ' + (on ? 'border: 1px solid #1F63B8; background: #EAF2FC; color: #1F63B8; font-weight: 600' : 'border: 1px solid #D0D5DD; background: #FFFFFF; color: #344054') };
    });
    const up = 'font-size: 12px; font-weight: 600; color: #1F7A3A', down = 'font-size: 12px; font-weight: 600; color: #C0362C';
    const kpis = [
      { label: 'Khách mới', value: '1.284', delta: '▲ 9,3%', deltaStyle: up },
      { label: 'Tỉ lệ chốt', value: '18,4%', delta: '▼ 0,8 điểm', deltaStyle: down },
      { label: 'Doanh thu', value: '284,6 tr ₫', delta: '▲ 5,1%', deltaStyle: up },
      { label: 'Chi phí/khách chốt', value: '283.000 ₫', delta: '▲ 4,0%', deltaStyle: down },
    ];
    const v = [92,88,95,101,97,110,104,99,108,115,112,118,109,121,126,119,124,131,128,122,135,138,130,141,137,144,149,142,151,156];
    const pts = v.map((y, i) => (i * 330 / (v.length - 1)).toFixed(1) + ',' + (104 - (y - 80) * 1.2).toFixed(1));
    return { ranges, kpis, line: pts.join(' '), area: '0,104 ' + pts.join(' ') + ' 330,104' };
  }
}
</script>
</body>
</html>
